<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="description" content="Hệ thống luyện thi Tiếng Anh Chuyên Ngành (TACN) giữa kỳ thông minh với phương pháp Active Recall, dấu hiệu bắt bài và tối ưu di động.">
  <title>IT English Study Console • Active Recall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="study.css">
  <link rel="stylesheet" href="motion.css">
  <link rel="stylesheet" href="pm.css">
</head>
<body>

  <div class="app-shell">

    <!-- Top Utility Bar -->
    <header class="top-bar">
      <div class="app-brand">
        <div class="app-brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 17 10 11 4 5"></polyline>
            <line x1="12" y1="19" x2="20" y2="19"></line>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="app-brand-title">
            <span>IT English</span>
          </h1>
        </div>
      </div>

      <div class="top-actions">
        <button id="btn-shuffle" class="btn-quiet" title="Trộn lại ngẫu nhiên câu hỏi (R)" aria-label="Trộn đề ngẫu nhiên">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
          <span>Trộn đề</span>
          <kbd>R</kbd>
        </button>

        <button id="btn-bgm" class="btn-quiet" title="Nhạc nền: bai1.mp3" aria-label="Bật hoặc tắt nhạc nền">
          <span id="bgm-icon-wrap">
            <svg class="bgm-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5l12-2v13"></path>
              <circle cx="6" cy="18" r="3"></circle>
              <circle cx="18" cy="16" r="3"></circle>
            </svg>
          </span>
          <span id="bgm-label">Nhạc nền</span>
          <span class="bgm-bars" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
        </button>

        <button id="btn-audio" class="btn-quiet is-active" title="Bật / Tắt âm thanh hiệu ứng" aria-label="Bật hoặc tắt âm thanh hiệu ứng">
          <span id="audio-icon-wrap">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
          </span>
          <span id="audio-label">Âm thanh</span>
        </button>
      </div>
    </header>

    <!-- Segmented Navigation -->
    <nav class="segmented-control" role="tablist" aria-label="Chọn phần ôn tập">
      <button class="seg-item active" data-mode="part1" role="tab" aria-selected="true">
        <span>I: Ghép định nghĩa</span>
        <span class="count">68 câu</span>
      </button>
      <button class="seg-item" data-mode="part2" role="tab" aria-selected="false">
        <span>II: Điền Từ</span>
        <span class="count">90 câu</span>
      </button>
      <button class="seg-item" data-mode="part3" role="tab" aria-selected="false">
        <span>III: Đúng / Sai</span>
        <span class="count">70 câu</span>
      </button>
      <button class="seg-item" data-mode="all" role="tab" aria-selected="false">
        <span>Thi Thử Tổng Hợp</span>
        <span class="count">45 câu</span>
      </button>
    </nav>

    <!-- Metrics Dashboard -->
    <section class="metrics-dashboard" aria-label="Tiến trình học">
      <div class="metrics-grid">
        <div class="metric-chip">
          <span class="metric-label">Tiến độ</span>
          <span class="metric-value"><span id="metric-cur">1</span>/<span id="metric-total">48</span></span>
        </div>
        <div class="metric-chip">
          <span class="metric-label">Đúng</span>
          <span class="metric-value val-emerald" id="metric-correct">0</span>
        </div>
        <div class="metric-chip">
          <span class="metric-label">Sai</span>
          <span class="metric-value val-rose" id="metric-wrong">0</span>
        </div>
        <div class="metric-chip">
          <span class="metric-label">Độ chính xác</span>
          <span class="metric-value val-accent" id="metric-pct">0%</span>
        </div>
        <div class="metric-chip metric-chip-streak" id="metric-streak-wrap" title="Chuỗi trả lời đúng liên tiếp">
          <span class="metric-label">Chuỗi Đúng</span>
          <span class="metric-value val-amber" id="metric-streak">0 🔥</span>
        </div>
      </div>

      <div class="review-alert-wrap" id="review-alert-wrap" style="display:none;">
        <button id="btn-review-wrong" class="btn-review-wrong">
          <span>↺ Luyện lại riêng <span id="wrong-badge-count">0</span> câu làm sai</span>
        </button>
      </div>

      <div class="track-line" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Thanh tiến độ">
        <div class="track-fill" id="track-fill"></div>
      </div>
    </section>

    <!-- Active Question Console Card -->
    <main id="active-card-container"></main>

    <!-- Keyboard Shortcuts Legend (Desktop only) -->
    <footer class="shortcuts-footer" aria-label="Phím tắt trên máy tính">
      <div class="shortcut-pill"><kbd>1</kbd>-<kbd>4</kbd> / <kbd>A</kbd>-<kbd>D</kbd> Chọn đáp án</div>
      <div class="shortcut-pill"><kbd>T</kbd>/<kbd>F</kbd> True/False</div>
      <div class="shortcut-pill"><kbd>Space</kbd> / <kbd>Enter</kbd> Câu tiếp theo</div>
      <div class="shortcut-pill"><kbd>R</kbd> Trộn đề mới</div>
    </footer>

  </div>

  <audio id="bgm-audio" src="bai1.mp3" preload="metadata" loop></audio>
  <script src="questions.js"></script>
  <script src="app.js"></script>
  <script src="part1.js"></script>
  <script src="memory.js"></script>
  <script src="writing.js"></script>
  <script src="study.js"></script>
  <script src="pm-data.js"></script>
  <script src="pm.js"></script>
  <script src="motion.js"></script>

</body>
</html>
