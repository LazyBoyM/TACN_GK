<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="description" content="Hệ thống luyện thi Tiếng Anh Chuyên Ngành (TACN) giữa kỳ thông minh với phương pháp Active Recall, dấu hiệu bắt bài và tối ưu di động.">
  <title>IT English Study Console • Active Recall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --bg-surface: #0f1523;
      --surface-1: rgba(17, 24, 39, 0.78);
      --surface-2: rgba(24, 34, 53, 0.72);
      --surface-3: rgba(30, 43, 67, 0.85);
      --surface-hover: rgba(37, 52, 80, 0.9);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.18);
      --border-active: #38bdf8;
      --text-1: #f8fafc;
      --text-2: #cbd5e1;
      --text-3: #8492a6;
      --accent: #38bdf8;
      --accent-deep: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --accent-muted: rgba(14, 165, 233, 0.12);
      --emerald: #10b981;
      --emerald-light: #34d399;
      --emerald-muted: rgba(16, 185, 129, 0.12);
      --emerald-border: rgba(16, 185, 129, 0.35);
      --rose: #f43f5e;
      --rose-light: #fb7185;
      --rose-muted: rgba(244, 63, 94, 0.12);
      --rose-border: rgba(244, 63, 94, 0.35);
      --amber: #f59e0b;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 10px 28px -6px rgba(0, 0, 0, 0.5), 0 3px 10px rgba(0, 0, 0, 0.3);
      --shadow-glow: 0 0 25px -4px rgba(14, 165, 233, 0.25);
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    ::selection {
      background: rgba(14, 165, 233, 0.35);
      color: #ffffff;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg);
    }
    ::-webkit-scrollbar-thumb {
      background: #253349;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334460;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(14, 165, 233, 0.14), transparent 70%),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(99, 102, 241, 0.08), transparent 60%),
        radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px;
      color: var(--text-1);
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px max(40px, env(safe-area-inset-bottom, 24px));
      line-height: 1.5;
    }

    .app-shell {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Utility Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
      gap: 12px;
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .app-brand-mark {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), rgba(99, 102, 241, 0.2));
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
      box-shadow: 0 0 15px rgba(14, 165, 233, 0.2);
    }

    .brand-text {
      min-width: 0;
    }

    .app-brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-1);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-badge-gk {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(14, 165, 233, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--accent);
    }

    .app-brand-sub {
      font-size: 0.78rem;
      color: var(--text-3);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .app-brand-sub .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-quiet {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      color: var(--text-2);
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition);
      touch-action: manipulation;
      min-height: 38px;
    }

    .btn-quiet:hover {
      background: var(--surface-2);
      color: var(--text-1);
      border-color: var(--border-hover);
    }

    .btn-quiet:active {
      transform: scale(0.97);
    }

    .btn-quiet:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn-quiet.is-active {
      background: rgba(14, 165, 233, 0.12);
      border-color: rgba(56, 189, 248, 0.3);
      color: var(--accent);
    }

    kbd {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      background: var(--surface-3);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      padding: 1px 5px;
      color: var(--text-2);
      font-weight: 500;
    }

    /* Segmented Navigation */
    .segmented-control {
      background: var(--surface-1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 4px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .seg-item {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-2);
      padding: 10px 8px;
      border-radius: var(--radius-md);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      transition: all var(--transition);
      text-align: center;
      touch-action: manipulation;
    }

    .seg-item:hover {
      color: var(--text-1);
      background: rgba(255, 255, 255, 0.03);
    }

    .seg-item.active {
      background: linear-gradient(180deg, rgba(30, 48, 77, 0.8) 0%, rgba(20, 30, 48, 0.95) 100%);
      color: var(--text-1);
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 4px 14px -2px rgba(14, 165, 233, 0.2);
    }

    .seg-item .count {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-3);
      font-weight: 500;
      background: rgba(0, 0, 0, 0.2);
      padding: 1px 6px;
      border-radius: 999px;
    }

    .seg-item.active .count {
      color: var(--accent);
      background: rgba(14, 165, 233, 0.15);
    }

    /* Scoreboard & Metrics Dashboard */
    .metrics-dashboard {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .metric-chip {
      background: var(--surface-1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 2px;
      transition: border-color var(--transition);
    }

    .metric-chip:hover {
      border-color: var(--border-hover);
    }

    .metric-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-3);
    }

    .metric-value {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-1);
      font-variant-numeric: tabular-nums;
    }

    .val-emerald { color: var(--emerald-light); }
    .val-rose { color: var(--rose-light); }
    .val-accent { color: var(--accent); }

    /* Review Wrong Answers Button */
    .review-alert-wrap {
      display: flex;
      justify-content: flex-end;
    }

    .btn-review-wrong {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: var(--rose-light);
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition);
      animation: pulseGlow 2.5s infinite;
      touch-action: manipulation;
    }

    .btn-review-wrong:hover {
      background: rgba(244, 63, 94, 0.2);
      border-color: var(--rose);
      transform: translateY(-1px);
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.2); }
      50% { box-shadow: 0 0 12px 2px rgba(244, 63, 94, 0.25); }
    }

    .track-line {
      width: 100%;
      height: 6px;
      background: var(--surface-2);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    .track-fill {
      height: 100%;
      background: linear-gradient(90deg, #0284c7 0%, #0ea5e9 50%, #38bdf8 100%);
      width: 0%;
      transition: width 250ms ease-out;
      border-radius: 999px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    /* Main Console Surface */
    .console-card {
      background: var(--surface-1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      box-shadow: var(--shadow-md);
      position: relative;
      animation: cardIn 220ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .meta-phase-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--accent);
      background: rgba(14, 165, 233, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 999px;
      padding: 3px 10px;
      letter-spacing: 0.03em;
    }

    .meta-counter {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
      background: rgba(255, 255, 255, 0.04);
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
    }

    /* Pure Question Text: Absolutely NO spoilers or highlighted hints before answering */
    .question-prompt {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.65;
      color: #f1f5f9;
      max-width: 70ch;
      letter-spacing: -0.01em;
      word-break: break-word;
    }

    /* Options Stack */
    .options-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice-row {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      color: var(--text-1);
      padding: 14px 18px;
      border-radius: var(--radius-md);
      font-size: 0.98rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all var(--transition);
      text-align: left;
      outline: none;
      min-height: 52px;
      touch-action: manipulation;
    }

    .choice-row:hover:not(:disabled) {
      background: var(--surface-3);
      border-color: rgba(56, 189, 248, 0.3);
      transform: translateY(-1px);
    }

    .choice-row:active:not(:disabled) {
      transform: scale(0.99);
    }

    .choice-row:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .choice-row.state-correct {
      background: var(--emerald-muted) !important;
      border-color: var(--emerald) !important;
      color: var(--emerald-light) !important;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.2);
    }

    .choice-row.state-correct .key-badge {
      background: var(--emerald);
      color: #0b0f17;
      border-color: var(--emerald);
      font-weight: 700;
    }

    .choice-row.state-incorrect {
      background: var(--rose-muted) !important;
      border-color: var(--rose) !important;
      color: var(--rose-light) !important;
      box-shadow: 0 0 16px rgba(244, 63, 94, 0.2);
    }

    .choice-row.state-incorrect .key-badge {
      background: var(--rose);
      color: #ffffff;
      border-color: var(--rose);
      font-weight: 700;
    }

    .choice-row:disabled {
      cursor: default;
    }

    .choice-leading {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .choice-text {
      flex: 1;
      line-height: 1.45;
      word-break: break-word;
    }

    .key-badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-2);
      flex-shrink: 0;
      transition: all var(--transition);
    }

    .choice-row:hover:not(:disabled) .key-badge {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* True/False Buttons */
    .binary-stack {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .binary-btn {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      padding: 18px 16px;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all var(--transition);
      color: var(--text-1);
      min-height: 56px;
      touch-action: manipulation;
    }

    .binary-btn:hover:not(:disabled) {
      background: var(--surface-3);
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .binary-btn:active:not(:disabled) {
      transform: scale(0.99);
    }

    .binary-btn.state-correct {
      background: var(--emerald-muted) !important;
      border-color: var(--emerald) !important;
      color: var(--emerald-light) !important;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.2);
    }

    .binary-btn.state-correct .key-badge {
      background: var(--emerald);
      color: #0b0f17;
      border-color: var(--emerald);
      font-weight: 700;
    }

    .binary-btn.state-incorrect {
      background: var(--rose-muted) !important;
      border-color: var(--rose) !important;
      color: var(--rose-light) !important;
      box-shadow: 0 0 16px rgba(244, 63, 94, 0.2);
    }

    .binary-btn.state-incorrect .key-badge {
      background: var(--rose);
      color: #ffffff;
      border-color: var(--rose);
      font-weight: 700;
    }

    .binary-btn:disabled {
      cursor: default;
    }

    /* Feedback & Translation Panel */
    .feedback-panel {
      background: linear-gradient(180deg, rgba(20, 29, 46, 0.95) 0%, rgba(14, 21, 35, 0.95) 100%);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: enterFeedback 200ms cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.4);
    }

    .feedback-status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1.4;
    }

    .feedback-status.is-correct { 
      color: var(--emerald-light); 
    }
    
    .feedback-status.is-incorrect { 
      color: var(--rose-light); 
    }

    .status-icon-pill {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .feedback-status.is-correct .status-icon-pill {
      background: rgba(16, 185, 129, 0.2);
      color: var(--emerald-light);
      border: 1px solid var(--emerald);
    }

    .feedback-status.is-incorrect .status-icon-pill {
      background: rgba(244, 63, 94, 0.2);
      color: var(--rose-light);
      border: 1px solid var(--rose);
    }

    .clue-discovery-box {
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.08) 0%, rgba(99, 102, 241, 0.05) 100%);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .clue-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .clue-label {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .clue-val-keyword {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
      color: #7dd3fc;
      font-size: 0.95rem;
      background: rgba(14, 165, 233, 0.12);
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
      width: fit-content;
      max-width: 100%;
      word-break: break-word;
    }

    .clue-val-tip {
      font-size: 0.9rem;
      color: var(--text-2);
      line-height: 1.55;
    }

    .feedback-vn {
      font-size: 0.92rem;
      color: var(--text-2);
      line-height: 1.6;
      border-top: 1px solid var(--border-subtle);
      padding-top: 12px;
    }

    .prompt-highlight {
      background: rgba(14, 165, 233, 0.18);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 6px;
      padding: 1px 6px;
      font-weight: 600;
      box-shadow: 0 0 10px rgba(14, 165, 233, 0.2);
    }

    /* Controls Action Bar */
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      gap: 12px;
    }

    .desktop-hint {
      font-size: 0.82rem;
      color: var(--text-3);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: var(--radius-md);
      font-size: 0.94rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all var(--transition);
      box-shadow: 0 4px 16px rgba(14, 165, 233, 0.3);
      touch-action: manipulation;
      min-height: 46px;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #0369a1 0%, #0284c7 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

          <span id="audio-label">Âm thanh</span>
        </button>
      </div>
    </header>

    <!-- Segmented Navigation -->
    <nav class="segmented-control" role="tablist" aria-label="Chọn phần ôn tập">
      <button class="seg-item active" data-mode="part1" role="tab" aria-selected="true">
        <span>I: Ghép định nghĩa</span>
        <span class="count">48 câu</span>
      </button>
      <button class="seg-item" data-mode="part2" role="tab" aria-selected="false">
        <span>II: Điền Từ</span>
        <span class="count">50 câu</span>
      </button>
      <button class="seg-item" data-mode="part3" role="tab" aria-selected="false">
        <span>III: Đúng / Sai</span>
        <span class="count">50 câu</span>
      </button>
      <button class="seg-item" data-mode="all" role="tab" aria-selected="false">
        <span>Thi Thử Tổng Hợp</span>
        <span class="count">45 câu</span>
      </button>
    </nav>

    <!-- Metrics Dashboard -->
    <section class="metrics-dashboard" aria-label="Tiến trình học">
      <div class="metrics-grid">
        <div class="metric-chip">
          <span class="metric-label">Tiến độ</span>
          <span class="metric-value"><span id="metric-cur">1</span>/<span id="metric-total">48</span></span>
        </div>
        <div class="metric-chip">
          <span class="metric-label">Đúng</span>
          <span class="metric-value val-emerald" id="metric-correct">0</span>
        </div>
        <div class="metric-chip">
          <span class="metric-label">Sai</span>
          <span class="metric-value val-rose" id="metric-wrong">0</span>
        </div>
        <div class="metric-chip">
          <span class="metric-label">Độ chính xác</span>
          <span class="metric-value val-accent" id="metric-pct">0%</span>
        </div>
      </div>

      <div class="review-alert-wrap" id="review-alert-wrap" style="display:none;">
        <button id="btn-review-wrong" class="btn-review-wrong">
          <span>↺ Luyện lại riêng <span id="wrong-badge-count">0</span> câu làm sai</span>
        </button>
      </div>

      <div class="track-line" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Thanh tiến độ">
        <div class="track-fill" id="track-fill"></div>
      </div>
    </section>

    <!-- Active Question Console Card -->
    <main id="active-card-container"></main>

    <!-- Keyboard Shortcuts Legend (Desktop only) -->
    <footer class="shortcuts-footer" aria-label="Phím tắt trên máy tính">
      <div class="shortcut-pill"><kbd>1</kbd>-<kbd>4</kbd> / <kbd>A</kbd>-<kbd>D</kbd> Chọn đáp án</div>
      <div class="shortcut-pill"><kbd>T</kbd>/<kbd>F</kbd> True/False</div>
      <div class="shortcut-pill"><kbd>Space</kbd> / <kbd>Enter</kbd> Câu tiếp theo</div>
      <div class="shortcut-pill"><kbd>R</kbd> Trộn đề mới</div>
    </footer>

  </div>
